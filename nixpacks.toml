[phases.setup]
nixPkgs = ["python311", "dotnet-sdk_8", "ffmpeg"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements_linux.txt",
    "cd dotnet_downloader && dotnet build -c Release"
]

[start]
cmd = ". /opt/venv/bin/activate && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
